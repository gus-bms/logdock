  /* 이 시안의 배치. 화면 흐름 명세 5절 UI-10(수집 연결 목록)·UI-11(수집 연결 등록)과 4절 CM-05·CM-07·CM-08의 정적 시안이다.

  body { min-width: 1080px; }
  .page { display: grid; gap: var(--layout-gutter); padding: var(--space-4) var(--layout-pad-x) 96px; max-width: 1440px; align-content: start; }

  .filter-group { display: grid; gap: 2px; align-content: start; }
  .filter-group .section-label { margin-bottom: var(--space-1); }
  .filter-group.cols2 { grid-template-columns: 1fr 1fr; grid-template-rows: auto repeat(6, auto); grid-auto-flow: column; column-gap: var(--space-3); }
  .filter-group.cols2 .section-label { grid-column: 1 / -1; grid-row: 1; }

  .conn td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conn td:first-child { padding-left: var(--space-3); }
  .conn .kind { display: inline-block; width: 72px; color: var(--color-text-tertiary); }

  .progress-card .kind { display: inline-block; width: 72px; color: var(--color-text-tertiary); }
  .progress-card .body { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: var(--space-5); padding: var(--space-4); align-items: start; }

  .reg-side { padding: var(--space-2); position: sticky; top: calc(var(--size-topbar) + var(--space-4)); }

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const badge = (k, t) => `<span class="badge ${k}">${t}</span>`;
const stale = (t) => `<span class="stale">마지막 보고 기준 ${t}</span>`;
const unk = '<span class="unknown-v">미확인</span>';
const kv = (rows) => rows.map(([k, v]) => `<div><dt>${k}</dt><dd><span>${v}</span></dd></div>`).join('');

/* CM-05 상태 이름 → 색(design-system 3.4절 표) */
const ADMIN = ['등록·연결 대기', '사용', '종료 진행', '전송 차단'];
const OBS = ['연결 대기', '관측됨·무로그', '수집/전송 진행', '읽기 일시정지', '설정/복구 확인 필요', '디스크 사용 불가', '이벤트 거부 관측', '전송 오류/보류', '복구 중', '관측 오래됨/미확인', '시각 확인 필요', '중단/보관'];
const TONE = {
  '사용': 'success', '등록·연결 대기': 'info', '종료 진행': 'info', '전송 차단': 'warning', '보관': 'neutral',
  '수집/전송 진행': 'success', '연결 대기': 'info', '복구 중': 'info', '읽기 일시정지': 'warning', '설정/복구 확인 필요': 'warning', '이벤트 거부 관측': 'warning', '시각 확인 필요': 'warning',
  '디스크 사용 불가': 'danger', '전송 오류/보류': 'danger', '관측 오래됨/미확인': 'unknown', '관측됨·무로그': 'neutral', '중단/보관': 'neutral',
};
const KIND = { file: '파일', file_pattern: '파일명 규칙', journald: 'journald' };

/* 합성 연결. 경로·이름·시각은 모두 예시다. action은 API 4.4절 `조치 필요` 계산 결과(서버가 계산해 메뉴와 목록이 같이 쓴다) */
const SEED = () => ({
  svc: { 결제: { archived: false }, 주문: { archived: false }, 배송: { archived: true, at: '2026-10-30 18:00:00' } },
  conn: [
    { svc: '결제', kind: 'file', target: '/var/app/payment/app.log', server: 'app-01', env: '운영', admin: '사용', obs: '수집/전송 진행', report: '10:14:52', queue: '0.3MB', link: 'base' },
    { svc: '결제', kind: 'file_pattern', target: '/var/app/payment/app-*.log', server: 'app-02', env: '운영', admin: '사용', obs: '읽기 일시정지', sub: '대기 공간 포화 · 10:02:11부터', report: '10:14:40', queue: '512MB', link: 'problem' },
    { svc: '결제', kind: 'journald', target: '컨테이너 payment-worker', server: 'app-01', env: '운영', admin: '사용', obs: '관측됨·무로그', report: '10:14:50', queue: '0MB' },
    { svc: '결제', kind: 'file', target: '/var/app/payment/settle.log', server: 'app-03', env: '운영', admin: '전송 차단', obs: '전송 오류/보류', sub: '인증 오류 · 키 폐기 10:15:04', report: '10:14:52', queue: '0.3MB', queueStale: true, action: true, link: 'blocked' },
    { svc: '주문', kind: 'journald', target: '단위 order-api', server: 'app-02', env: '운영', admin: '사용', obs: '관측 오래됨/미확인', sub: '09:31:07 이후 보고 없음', report: '09:31:07', queue: '40MB', queueStale: true, action: true, link: 'stale' },
    { svc: '주문', kind: 'file', target: '/var/app/order/app.log', server: 'app-02', env: '운영', admin: '사용', obs: '설정/복구 확인 필요', sub: '이어 읽을 근거 없음', report: '10:13:20', queue: '1.2MB', action: true, link: 'hold' },
    { svc: '주문', kind: 'file', target: '/var/app/order/batch/app.log', server: null, env: null, admin: '사용', obs: '시각 확인 필요', sub: '서버 시계가 중앙보다 4분 23초 빠름', report: '10:14:49', queue: '0.1MB', action: true },
    { svc: '주문', kind: 'file_pattern', target: '/var/app/order/app-*.log', server: 'app-01', env: '운영', admin: '등록·연결 대기', obs: '연결 대기', sub: '등록 뒤 26시간 · 설정을 적용하지 않았을 수 있음', report: null, queue: null, action: true },
    { svc: '결제', kind: 'file', target: '/var/app/payment/legacy.log', server: 'app-02', env: '운영', admin: '보관', obs: '중단/보관', report: '2026-10-28 09:00:00', queue: null, archivedAt: '2026-10-28 09:02:10' },
    { svc: '배송', kind: 'file', target: '/var/app/delivery/app.log', server: 'app-01', env: '운영', admin: '보관', obs: '중단/보관', report: '2026-10-30 17:58:40', queue: null, archivedAt: '2026-10-30 18:00:00', withSvc: true },
  ],
});
const REFS = {
  주문: { searches: ['주문 오류', '주문·결제 연동 오류'], rules: ['주문 오류 알림'] },
  결제: { searches: ['결제 승인 실패'], rules: ['결제 오류 급증'] },
  배송: { searches: [], rules: [] },
};
let D = SEED();
let scope = 'active';
let filters = new Set(); /* 'q:action' | 'a:<관리 상태>' | 'o:<관측 상태>' */
let archiveFlow = null;
let reauthOk = false; /* CM-07 상태 2: 최근 재인증이 유효하면 비밀번호를 다시 묻지 않는다 */

function actionCount() { return D.conn.filter((c) => c.action && c.admin !== '보관').length; }
function renderMenu() {
  const n = actionCount(), el = $('#menu-count');
  el.hidden = n === 0; el.textContent = n; el.setAttribute('aria-label', `조치 필요 ${n}건`);
}
function matches(c) {
  if (!filters.size) return true;
  const q = [...filters].filter((f) => f.startsWith('q:')), a = [...filters].filter((f) => f.startsWith('a:')), o = [...filters].filter((f) => f.startsWith('o:'));

let opener = null;
function closeDialog() { $('#dialog-root').innerHTML = ''; document.removeEventListener('keydown', escClose); opener && opener.isConnected && opener.focus(); }
function escClose(e) { if (e.key === 'Escape') closeDialog(); }
function openDialog({ title, target, impacts, extra = '', action, danger, wide, password = true, validate, delay = 900, onOk }) {
  opener = document.activeElement;
  const needPw = password && !reauthOk;
  $('#dialog-root').innerHTML = `<div class="dialog-backdrop"><div class="dialog${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
    <div class="dialog-head"><h2 id="dlg-t">${title}</h2></div>
    <div class="dialog-body">
      ${target ? `<div class="field"><span class="field-label">대상</span><dl class="kv">${kv(target)}</dl></div>` : ''}
      ${extra}
      ${impacts ? `<div class="field"><span class="field-label">영향</span><ul class="impact">${impacts.map((i) => `<li${i.startsWith('!') ? ' class="strong"' : ''}>${i.replace(/^!/, '')}</li>`).join('')}</ul></div>` : ''}
      ${needPw ? `<div class="field"><label class="field-label" for="pw">비밀번호 다시 입력</label><input class="input" id="pw" type="password" autocomplete="current-password" aria-describedby="pw-err"><span id="pw-err" class="field-error" hidden></span><span class="field-hint">시안: 4자 미만은 틀린 비밀번호로 처리합니다.</span></div>`
        : password ? '<p class="field-hint" style="margin:0">최근에 비밀번호를 확인해 다시 묻지 않습니다.</p>' : ''}
    </div>
    <div class="dialog-foot"><button class="btn" id="dlg-cancel">취소</button><button class="btn ${danger ? 'danger' : 'primary'}" id="dlg-ok">${action}</button></div>
  </div></div>`;
  document.addEventListener('keydown', escClose);
  $('#dlg-cancel').onclick = closeDialog;
  $('.dialog-backdrop').onclick = (e) => { if (e.target.classList.contains('dialog-backdrop')) closeDialog(); };
  ($('#pw') || $('.dialog-body input') || $('#dlg-ok')).focus();
  $('#dlg-ok').onclick = () => {
    if (validate && !validate()) return;
    if (needPw) {
      const pw = $('#pw'), err = $('#pw-err');
      if (pw.value.length < 4) { pw.setAttribute('aria-invalid', 'true'); err.hidden = false; err.textContent = pw.value ? '비밀번호가 맞지 않습니다.' : '비밀번호를 입력하세요.'; pw.focus(); return; }
      reauthOk = true;
    }
    const dlg = $('.dialog'), ok = $('#dlg-ok');
    dlg.setAttribute('aria-busy', 'true'); ok.setAttribute('aria-busy', 'true'); ok.textContent = `${action} 중…`;
    dlg.querySelectorAll('input, #dlg-cancel').forEach((el) => { el.disabled = true; });
    document.removeEventListener('keydown', escClose); $('.dialog-backdrop').onclick = null;
    setTimeout(() => { closeDialog(); onOk(); }, location.hash === '#busy' ? 600000 : delay);
  };
}
function toast(kind, label, title, text) {
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.innerHTML = `<div class="toast-text"><span class="toast-kind">${label}</span><strong>${title}</strong>${text ? `<p>${text}</p>` : ''}</div><button class="btn ghost sm icon-only" aria-label="닫기"><svg class="icon"><use href="#i-x"/></svg></button>`;
  el.querySelector('button').onclick = () => el.remove();
  $('#toasts').prepend(el);
  if (kind === '' || kind === 'note') setTimeout(() => el.remove(), 6000);
}

function pathError(kind, p) {
  if (!p.trim()) return '로그 서버 기준 경로를 입력하세요.';

  if (/[[\]\\]/.test(p)) return '[ ] \\ 글자는 쓸 수 없습니다.';
  if (/\/\.\.(\/|$)|\/\/|\/$/.test(p)) return '경로에 .. 이나 //를 쓸 수 없고 /로 끝날 수 없습니다.';
  const cut = p.lastIndexOf('/'), dir = p.slice(0, cut), name = p.slice(cut + 1);
  if (/\*\*/.test(p)) return '하위 폴더는 찾지 않습니다. ** 대신 폴더마다 따로 등록하세요.';
  if (/[*?]/.test(dir)) return '* ?는 파일 이름 부분에만 쓸 수 있습니다. 폴더는 고정 경로로 넣으세요.';
  if (kind === 'file' && /[*?]/.test(name)) return '파일 하나에는 * ?를 쓸 수 없습니다. 파일명 규칙을 고르세요.';
  if (kind === 'file_pattern' && !/[*?]/.test(name)) return '이름에 * ?가 없습니다. 파일 하나를 고르세요.';
  return '';
}

}

    if (a === 'next') { const bad = validateStep(); if (bad) { renderReg(); $('#' + bad).focus(); return; } goStep(R.step + 1); return; }
    if (a === 'confirm') { confirmReg(); return; }
    if (a === 'reload') { R.svc = '주문 API'; D.svc = { 결제: D.svc.결제, '주문 API': D.svc.주문, 배송: D.svc.배송 }; R.result = null; regMode = 'normal'; syncDemo(); renderReg(); toast('note', '안내', '바뀐 내용을 불러왔습니다.', '서비스 이름이 주문 API로 바뀌었습니다. 확인한 뒤 확정하세요.'); return; }
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.matches('[data-f]')) { t.checked ? filters.add(t.dataset.f) : filters.delete(t.dataset.f); renderList(); return; }
  if (t.name === 'svcmode') { readInputs(); R.svcMode = t.value; R.errors = {}; renderReg(); $(R.svcMode === 'new' ? '#newSvc' : '#svc').focus(); return; }
  if (t.id === 'copied') { R.copied = t.checked; renderReg(); $('#copied').focus(); return; }
});
document.addEventListener('input', (e) => { if (e.target.id === 'nn') window.__nn = e.target.value; });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#filter-pop').hidden) toggleFilterPop(false); });
$$('#demo-view button').forEach((b) => b.onclick = () => setView(b.dataset.v));
$('#demo-state').onchange = (e) => applyDemo(e.target.value);

/* 이름 변경 창의 입력값을 onOk에서 읽기 위해 창을 열 때 기본값을 넣어 둔다 */
const _rename = SVC_ACTS.rename;
SVC_ACTS.rename = (name) => { window.__nn = `${name} API`; _rename(name); };

const themeBtn = document.getElementById('theme');
function setTheme(t) { document.documentElement.dataset.theme = t; themeBtn.textContent = t === 'dark' ? '밝은 테마 보기' : '어두운 테마 보기'; }
themeBtn.addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
const q = new URLSearchParams(location.search);
if (q.get('theme') === 'dark') setTheme('dark');
const qv = q.get('view') === 'reg' ? 'reg' : 'list';
const qs = DEMO[qv].some(([v]) => v === q.get('state')) ? q.get('state') : undefined;
setView(qv, qs);
if (qv === 'reg' && q.get('step') && !qs) { R.step = Math.min(5, Math.max(1, +q.get('step'))); if (q.get('format')) R.format = q.get('format'); renderReg(); }
if (location.hash === '#archive') SVC_ACTS.archive('주문');
if (location.hash === '#rename') SVC_ACTS.rename('결제');
if (location.hash === '#reactivate') { scope = 'archived'; renderList(); SVC_ACTS.reactivate('배송'); }
if (location.hash === '#filter') toggleFilterPop(true);
if (location.hash === '#confirm' && view === 'reg') confirmReg();
</script>
<script src="menu.js"></script>
</body>

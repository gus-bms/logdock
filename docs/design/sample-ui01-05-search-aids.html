<style>
  /* 이 시안의 배치. 화면 흐름 명세 5절 UI-01(로그인)·UI-02 알림 조사 모드·UI-04(주변 로그)·UI-05(저장 검색)와 CM-02~CM-08의 정적 시안이다.
     와이어프레임 정리표의 기본안(WQ-06~17, WQ-24~29)과 디자인 시스템 11·12절, API 계약 4.2·4.3절을 따른다.
     알림 조사 모드의 사건은 알림 시안의 `주문·결제 timeout` 09:41 사건과 같다. 로그·시각·이름은 합성 값이며, 정하지 않은 한도(앞뒤 건수, 시간 폭, 저장 개수, 시도 제한 대기)는 `N`으로 쓴다. */
  :root { --demo-h: 44px; }
  body { min-width: 1080px; }
  .page { display: grid; gap: var(--space-3); padding: var(--space-4) var(--layout-pad-x) calc(var(--demo-h) + 48px); align-content: start; }
  .page[hidden] { display: none; }
  .p-note { margin: 0; font-size: var(--text-sm); color: var(--color-text-secondary); }
  .cell-sub { display: block; font-size: var(--text-sm); line-height: 16px; color: var(--color-text-secondary); margin-top: 2px; }
  .signed-out .menu, .signed-out .topbar-end .avatar { visibility: hidden; }

  /* UI-01 */
  .login-wrap { display: grid; justify-items: center; padding-top: 56px; }
  .login { width: 380px; }
  .login .in { padding: var(--space-5); display: grid; gap: var(--space-4); }
  .login h1 { margin: 0; font-size: var(--text-lg); }
  .login .btn.primary { width: 100%; justify-content: center; }

  /* UI-02 알림 조사 */
  .inv { padding: var(--space-3) var(--space-4); display: grid; gap: var(--space-2); }
  .inv-row { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; font-size: var(--text-sm); color: var(--color-text-secondary); }
  .inv-row a { color: var(--color-text-link); font-weight: var(--font-weight-medium); text-underline-offset: 3px; }
  .inv-row .strong { color: var(--color-text); font-weight: var(--font-weight-medium); }
  .inv-counts { display: flex; gap: var(--space-6); flex-wrap: wrap; font-size: var(--text-sm); color: var(--color-text-secondary); font-feature-settings: var(--font-feature-numeric); }
  .inv-counts b { color: var(--color-text); font-size: var(--text-base); font-weight: var(--font-weight-strong); }
  .reasons { margin: var(--space-1) 0 0; }
  .reasons td.wrap { white-space: normal; padding-top: 6px; padding-bottom: 6px; }
  .tb { display: flex; align-items: center; gap: var(--space-2); }
  .tb .timepick { min-width: 300px; justify-content: flex-start; }
  .tb .timepick.locked { cursor: default; box-shadow: var(--shadow-card), inset 0 0 0 1px var(--color-info-border); }
  .tb .querybar { flex: 1; }
  .chip.changed { box-shadow: inset 0 0 0 1px var(--color-warning-border); }
  .chip .tag { font-size: 11px; color: var(--color-warning-fg); padding: 0 6px 0 0; }
  .logtable td.t2, .logtable td.t2 + td, .logtable td.t2 ~ td { height: auto; padding-top: 6px; padding-bottom: 6px; }
  .logtable td .sub { display: block; font-size: 11.5px; color: var(--color-text-tertiary); line-height: 16px; }
  .rename { display: flex; gap: var(--space-2); align-items: center; font-size: var(--text-sm); color: var(--color-text-secondary); padding: 0 var(--space-1); }

  /* UI-04 */
  .back { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-sm); color: var(--color-text-link); text-decoration: none; font-weight: var(--font-weight-medium); }
  .nb-head { display: flex; align-items: center; gap: var(--space-4); }
  .nb-head h1 { margin: 0; font-size: var(--text-xl, 20px); }
  .nb-info { padding: var(--space-3) var(--space-4); display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 6px var(--space-4); font-size: var(--text-sm); align-items: center; }
  .nb-info > .k { color: var(--color-text-tertiary); font-weight: var(--font-weight-medium); }
  .nb-info > .v { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--color-text-secondary); }
  .loose { text-decoration: line-through; text-decoration-color: var(--color-text-tertiary); }
  .logtable tr.mark td { height: auto; padding: 8px var(--space-4); white-space: normal; font-size: var(--text-sm); color: var(--color-text-secondary); background: var(--color-bg-subtle); cursor: default; }
  .logtable tr.mark.dashed td { background: var(--color-unknown-bg); border-top: 1px dashed var(--color-unknown-border); border-bottom: 1px dashed var(--color-unknown-border); }
  .logtable tr.mark b { color: var(--color-text); font-weight: var(--font-weight-medium); margin-right: var(--space-2); }
  .logtable tr.mark a { color: var(--color-text-link); font-weight: var(--font-weight-medium); }
  .logtable tr.more td { height: 36px; text-align: center; background: transparent; cursor: default; }
  .logtable tr.mark:hover td, .logtable tr.more:hover td { background: inherit; }
  .logtable tr.sel td { background: var(--color-bg-selected); }
  .logtable tr.sel td:first-child { box-shadow: inset 2px 0 0 var(--color-accent); }
  .logtable .tagnew { font: var(--font-weight-medium) 11px/16px var(--font-sans); color: var(--color-info-fg); margin-left: 6px; }
  .logtable .tagsel { font: var(--font-weight-medium) 11px/16px var(--font-sans); color: var(--color-accent-fg); margin-left: 6px; }

  /* UI-05 */
  .saved td.wrap { white-space: normal; padding-top: 7px; padding-bottom: 7px; }
  .saved td .acts { display: flex; gap: 2px; justify-content: flex-end; }
  .dialog.wide { width: 720px; max-width: calc(100vw - 48px); }
  .dialog.wide .dialog-body { display: grid; gap: var(--space-4); max-height: calc(100vh - 240px); overflow: auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg-row { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; }
  .empty { padding: 48px var(--space-6); display: grid; justify-items: center; gap: var(--space-3); text-align: center; }
  .empty h2 { margin: 0; font-size: var(--text-lg); }
  .empty p { margin: 0; max-width: 520px; color: var(--color-text-secondary); }

  .demo-switch { position: fixed; left: 0; right: 0; bottom: 0; height: var(--demo-h); display: flex; align-items: center; justify-content: center; gap: var(--space-2);
    padding: 0 var(--space-4); background: var(--color-toast-bg); color: var(--color-toast-text-secondary); font-size: var(--text-sm); box-shadow: var(--shadow-toast); z-index: var(--z-sticky); white-space: nowrap; }
  .demo-switch .segmented { height: 30px; background: rgb(255 255 255 / 0.08); box-shadow: none; }
  .demo-switch .segmented button { height: 26px; color: var(--color-toast-text-secondary); }
  .demo-switch .segmented button[aria-pressed="true"] { background: rgb(255 255 255 / 0.16); color: var(--color-toast-text); box-shadow: none; }
  .demo-switch select { height: 30px; border: 0; border-radius: var(--radius-full); padding: 0 var(--space-3); background: rgb(255 255 255 / 0.12); color: var(--color-toast-text); font-size: var(--text-sm); }
  .toast-stack { position: fixed; right: var(--space-4); top: calc(var(--size-topbar) + var(--space-3)); display: grid; gap: var(--space-2); z-index: var(--z-toast); }
</style>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const badge = (k, t) => `<span class="badge ${k}">${t}</span>`;
const kv = (rows) => rows.filter(Boolean).map(([k, v]) => `<div><dt>${k}</dt><dd><span>${v}</span></dd></div>`).join('');
const X = '<svg class="icon" style="width:12px;height:12px"><use href="#i-x"/></svg>';
const chip = (k, op, v, rm, extra = '') => `<span class="chip${extra}"><span class="chip-key">${k}</span><span class="chip-op">${op}</span><span class="chip-val">${v}</span>${rm ? `<button aria-label="${k} ${v} 조건 지우기" data-rm="${rm}">${X}</button>` : ''}</span>`;
const LV = { error: 'ERROR', warn: 'WARN', info: 'INFO', debug: 'DEBUG', unknown: '미확인' };
let view = 'login', demoState = 'base', auditDown = false;

function banner() {
  $('#banner-slot').innerHTML = auditDown && view !== 'login' ? '<div class="banner danger" role="status"><strong>감사 기록 장애</strong><span>2026-11-05 10:31:00 (UTC+09:00)부터 감사 기록을 저장하지 못하고 있습니다. 로그인·검색·수집은 계속됩니다. 키 발급, 등록·설정 변경, 비밀번호 변경, 알림 규칙 변경 등은 보류되니 복구된 뒤 다시 실행하세요.</span><a href="sample-ui13-16-system.html?view=audit&amp;state=down">감사 이력 보기</a></div>' : '';
}

/* ════ UI-01 로그인 ═════════════════════════════════════════ */
/* 로그인 전에는 상단 메뉴·전역 배너·내부 상태를 보이지 않는다. 실패 문구는 계정이 있는지와 어느 칸이 틀렸는지 드러내지 않는다(12절 login_failed) */
let loginState = 'base', loginBack = null;
function renderLogin() {
  banner();
  const st = loginState;
  const top = { fail: `<div class="callout danger" role="alert">${badge('danger', '로그인 실패')}<div>계정 이름 또는 비밀번호가 맞지 않습니다.</div></div>`,
    throttled: `<div class="callout danger" role="alert">${badge('danger', '잠시 막음')}<div><strong>로그인 시도가 많아 잠시 막았습니다.</strong> N분 뒤 다시 시도하세요. 남은 시간은 줄어드는 대로 고칩니다.</div></div>`,
    expired: `<div class="callout">${badge('neutral', '세션 만료')}<div><strong>세션이 끝났습니다. 다시 로그인하세요.</strong> 같은 탭에서 다시 로그인하면 보던 화면과 검색 조건으로 돌아갑니다. 활동이 1시간 없거나 로그인한 지 24시간이 지나면 다시 로그인해야 합니다.</div></div>`,
    mail: `<div class="callout info">${badge('info', '알림 링크')}<div><strong>알림 사건을 보려면 로그인하세요.</strong> 로그인하면 같은 사건의 알림 조사 화면이 열립니다.</div></div>` }[st] || '';
  $('#view-login').innerHTML = `<div class="login-wrap"><section class="card login" aria-labelledby="login-t"><form class="in" id="login-form" novalidate>
      <h1 id="login-t">로그인</h1>${top}
      <div class="field"><label class="field-label" for="l-id">계정 이름</label><input class="input" id="l-id" autocomplete="username" value="${st === 'fail' || st === 'throttled' ? 'ops' : ''}"></div>
      <div class="field"><label class="field-label" for="l-pw">비밀번호</label><input class="input" id="l-pw" type="password" autocomplete="current-password"></div>
      ${st === 'throttled' ? '<button class="btn primary" type="button" disabled aria-describedby="why-login">로그인</button><span class="disabled-reason" id="why-login">시도 제한으로 N분 동안 막혔습니다</span>' : '<button class="btn primary" type="submit">로그인</button>'}
      <p class="p-note">비밀번호를 잊었거나 계정이 잠겼으면 서버 운영자가 서버에서 직접 재설정합니다. 이메일로 복구하지 않습니다.</p>
      ${st === 'audit' ? '<p class="p-note" style="border-top:1px solid var(--color-border);padding-top:var(--space-3)">시안 안내: 감사 기록 장애 중에도 로그인은 됩니다. 로그인 전에는 장애를 알리지 않고, 로그인한 뒤 화면 위 배너로 알립니다.</p>' : ''}
    </form></section></div>`;
  if (st === 'fail') $('#l-pw').focus();
}
function doLogin() {
  const id = $('#l-id').value.trim(), pw = $('#l-pw').value;
  if (!id || !pw) { loginState = 'fail'; renderLogin(); return; }
  document.body.classList.remove('signed-out');
  if (loginBack) { const b = loginBack; loginBack = null; go(b.view, b); toast('', '성공', '다시 로그인했습니다.', '보던 화면으로 돌아왔습니다.'); return; }
  if (loginState === 'mail') { go('invest', { state: 'base' }); toast('', '성공', '로그인했습니다.', '알림 메일의 사건을 알림 조사 모드로 열었습니다.'); return; }
  if (loginState === 'audit') { location.href = 'sample-ui02-log-search.html#audit-down'; return; }
  location.href = 'sample-ui02-log-search.html';
}

/* ════ UI-02 알림 조사 모드 ═════════════════════════════════ */
/* 사건 참조로 당시 조건과 수신 시각 평가 구간을 다시 읽어 고정 검색한다(API 4.2절). 정렬만 바꾸면 모드를 유지하고(WQ-12), 조건·범위를 고치면 벗어난다(WQ-17) */
const INC = {
  base: { at: '2026-11-05 09:41:00', from: '09:26:00', to: '09:41:00', day: '2026-11-05', then: 27, now: 27, ud: [3, 3] },
  diff: { at: '2026-11-05 09:41:00', from: '09:26:00', to: '09:41:00', day: '2026-11-05', then: 27, now: 22, ud: [3, 3], reasons: { manual: '결제 · app-01 · app.log 연결의 2026-11-05 09:30:00 ~ 09:32:00 (UTC+09:00) 구간 로그를 구간 로그 삭제로 지웠습니다. 다시 전송돼도 저장하지 않으므로 현재 건수가 돌아오지 않습니다.' } },
  early: { at: '2026-07-14 10:05:00', from: '09:50:00', to: '10:05:00', day: '2026-07-14', then: 22, now: 0, ud: [1, 0], reasons: { early: '공간이 부족해 2026-11-05 03:00:12 (UTC+09:00)에 보관 기간(6개월)이 되기 전 로그를 삭제했습니다. 평가 구간은 조회 가능 시작일 2026-07-21보다 앞섭니다.' }, start: '2026-07-21' },
  partial: { at: '2026-11-03 14:02:00', from: '13:47:00', to: '14:02:00', day: '2026-11-03', then: 41, now: 46, ud: [1, 1], reasons: { partial: '평가가 일부 구간에서 실패했지만 끝난 구간의 건수만으로 임계(20건)를 넘어 발화했습니다. 당시 건수는 일부 구간의 건수입니다.' } },
  changed: { at: '2026-11-05 09:41:00', from: '09:26:00', to: '09:41:00', day: '2026-11-05', then: 27, now: 27, ud: [3, 3], rule: 'changed' },
  deleted: { at: '2026-11-05 09:41:00', from: '09:26:00', to: '09:41:00', day: '2026-11-05', then: 27, now: 27, ud: [3, 3], rule: 'deleted' },
  renamed: { at: '2026-11-05 09:41:00', from: '09:26:00', to: '09:41:00', day: '2026-11-05', then: 27, now: 27, ud: [3, 3], renamed: true },
  left: { at: '2026-11-05 09:41:00', from: '09:26:00', to: '09:41:00', day: '2026-11-05', left: true },
  expired: { expired: true },

  Object.assign(editing, { name, time: editTime, basis: editBasis, range: editTime === 'rel' ? '최근 1시간' : '2026-11-05 09:00:00 ~ 10:00:00', mod: '2026-11-05 10:42:10' });
  SAVED.sort((a, b) => (a.mod < b.mod ? 1 : -1));
  closeDialog(); renderSaved(); toast('', '성공', '저장 검색을 고쳤습니다.', '이 조건으로 만든 알림 규칙은 바뀌지 않았습니다.');
}
/* 다른 사람이 먼저 고침: 바뀐 항목과 저장 시각을 보이고 덮어쓰기·다시 불러오기를 고른다(WQ-28, API force) */
function openConflict(name) {
  $('#dialog-root').innerHTML = `<div class="dialog-backdrop"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
    <div class="dialog-head"><h2 id="dlg-t">다른 사람이 먼저 고쳤습니다</h2></div>
    <div class="dialog-body"><p class="p-note" style="color:var(--color-text)">수정 창을 연 뒤 이 저장 검색이 바뀌었습니다. 같은 계정을 쓰는 다른 사람이 고친 것일 수 있습니다.</p>
      <dl class="kv" style="grid-template-columns:120px 1fr">${kv([['저장 검색', esc(editing.name)], ['바뀐 항목', '조건, 시간'], ['열 때 수정본', '2026-11-05 09:40:12'], ['지금 저장된 것', '2026-11-05 10:02:31 (UTC+09:00)']])}</dl>
      <div class="field"><span class="field-label">영향</span><ul class="impact"><li class="strong">덮어쓰면 10:02:31에 저장된 내용이 내 수정으로 바뀝니다.</li><li>최신 내용을 불러오면 지금 고친 내용은 사라집니다.</li></ul></div></div>
    <div class="dialog-foot"><button class="btn" id="c-keep">계속 수정</button><button class="btn" id="c-reload">최신 내용 불러오기</button><button class="btn danger" id="c-force">덮어쓰고 저장</button></div></div></div>`;
  $('#c-keep').onclick = () => renderEditDialog();
  $('#c-reload').onclick = () => { closeDialog(); Object.assign(editing, { cond: '(서비스 주문 또는 결제) 그리고 (환경 운영) 그리고 (레벨 ERROR 또는 FATAL) 그리고 (본문에 "timeout" 포함)', time: 'rel', range: '최근 2시간', mod: '2026-11-05 10:02:31' }); renderSaved(); toast('note', '안내', '최신 내용을 불러왔습니다.', '10:02:31에 저장된 조건과 시간입니다.'); };
  $('#c-force').onclick = () => { savedState = 'base'; Object.assign(editing, { name, time: editTime, basis: editBasis, mod: '2026-11-05 10:42:10' }); closeDialog(); renderSaved(); toast('', '성공', '덮어쓰고 저장했습니다.', '10:02:31에 저장된 내용을 내 수정으로 바꿨습니다.'); };
  $('#c-force').focus();
}

/* ── 확인 창(CM-07, 비밀번호 없음)과 토스트(CM-08) ── */
let opener = null;
function closeDialog() { $('#dialog-root').innerHTML = ''; document.removeEventListener('keydown', escClose); opener && opener.isConnected && opener.focus(); }
function escClose(e) { if (e.key === 'Escape') closeDialog(); }
function openDialog({ title, target, impacts, action, cancel = '취소', danger, onOk }) {
  opener = document.activeElement;
  $('#dialog-root').innerHTML = `<div class="dialog-backdrop"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
    <div class="dialog-head"><h2 id="dlg-t">${title}</h2></div>
    <div class="dialog-body">${target ? `<dl class="kv" style="grid-template-columns:96px 1fr">${kv(target)}</dl>` : ''}
      <div class="field"><span class="field-label">영향</span><ul class="impact">${impacts.map((i) => `<li${i.startsWith('!') ? ' class="strong"' : ''}>${i.replace(/^!/, '')}</li>`).join('')}</ul></div></div>
    <div class="dialog-foot"><button class="btn" id="dlg-cancel">${cancel}</button><button class="btn ${danger ? 'danger' : 'primary'}" id="dlg-ok">${action}</button></div></div></div>`;
  document.addEventListener('keydown', escClose);
  $('#dlg-cancel').onclick = closeDialog;
  $('.dialog-backdrop').onclick = (e) => { if (e.target.classList.contains('dialog-backdrop')) closeDialog(); };
  $('#dlg-ok').focus();
  $('#dlg-ok').onclick = () => { closeDialog(); onOk(); };
}
function toast(kind, label, title, text) {
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.innerHTML = `<div class="toast-text"><span class="toast-kind">${label}</span><strong>${title}</strong>${text ? `<p>${text}</p>` : ''}</div><button class="btn ghost sm icon-only" aria-label="닫기"><svg class="icon"><use href="#i-x"/></svg></button>`;
  el.querySelector('button').onclick = () => el.remove();
  $('#toasts').prepend(el);
  if (kind === '' || kind === 'note') setTimeout(() => el.remove(), 6000);
  return el;
}
function toastAction(kind, label, title, text, actLabel, act) {
  const el = toast(kind, label, title, `${text} <a href="#" class="t-act">${actLabel}</a>`);
  el.querySelector('.t-act').onclick = (e) => { e.preventDefault(); el.remove(); act(); };
}

/* ════ 화면 전환과 시안 상태 ════════════════════════════════ */
const DEMO = {
  login: [['base', '기본'], ['fail', '로그인 실패'], ['throttled', '시도 제한으로 잠시 막힘'], ['expired', '세션 만료 안내'], ['mail', '알림 메일 링크로 들어옴'], ['audit', '감사 기록 장애 중 로그인']],
  invest: [['base', '기본(당시와 현재 같음)'], ['diff', '당시와 현재 다름(수동 삭제)'], ['early', '조기 삭제로 0건'], ['partial', '일부 구간만 평가'], ['changed', '규칙이 바뀜'], ['deleted', '규칙이 삭제됨'], ['renamed', '서비스 이름 바뀜'], ['left', '조건을 고쳐 모드를 벗어남'], ['expired', '알림 이력 보관 기간 지남'], ['session', '조사 중 세션 만료']],
  nearby: [['base', '같은 로그 흐름'], ['time', '같은 서비스·서버 시간순'], ['order', '회전 순서 미확인'], ['gaps', '빈 자리·끝 표시 여섯 가지'], ['limit', '범위 한도']],
  saved: [['base', '기본'], ['empty', '빈 목록'], ['archived', '보관된 연결 참조 실행'], ['edit', '수정(상대 시간 안내)'], ['conflict', '다른 사람이 먼저 고침'], ['gone', '수정 중 다른 사람이 지움'], ['delete', '삭제 확인'], ['limit', '개수 상한 도달']],
};
const TITLES = { login: '로그인', invest: '로그 탐색 · 알림 조사', nearby: '주변 로그', saved: '저장 검색' };
function syncDemo() {
  $$('#demo-view button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === view)));
  $('#demo-state').innerHTML = DEMO[view].map(([v, t]) => `<option value="${v}"${v === demoState ? ' selected' : ''}>${t}</option>`).join('');
  $('#m-saved').toggleAttribute('aria-current', view === 'saved');
  if (view === 'saved') $('#m-saved').setAttribute('aria-current', 'page');
  $('#m-search').toggleAttribute('aria-current', view === 'invest' || view === 'nearby');
  if (view === 'invest' || view === 'nearby') $('#m-search').setAttribute('aria-current', 'page');
}
function show(v) {
  view = v;
  Object.keys(TITLES).forEach((k) => { $('#view-' + k).hidden = k !== v; });
  document.title = `LogDock 시안 — ${TITLES[v]}`;
  document.body.classList.toggle('signed-out', v === 'login');
  window.scrollTo({ top: 0 });
}
function render() { ({ login: renderLogin, invest: renderInvest, nearby: renderNearby, saved: renderSaved })[view](); }
function applyDemo(s) {
  demoState = s; closeDialog(); auditDown = false;
  if (view === 'login') { loginState = s; loginBack = null; }
  else if (view === 'invest') { invState = s; invSort = 'desc'; invUd = false; invRemoved = null; }
  else if (view === 'nearby') { nbState = s === 'time' ? 'base' : s; nbMode = s === 'time' ? 'time' : 'stream'; nbLoaded = false; nbAfterLoaded = false; }
  else { savedState = s; SAVED = SAVED0(); }
  render(); syncDemo();
  if (view === 'saved') {
    if (s === 'archived') openRun(SAVED[3]);
    if (s === 'edit' || s === 'conflict' || s === 'gone') openEdit(SAVED[1]);
    if (s === 'delete') $('[data-del="s1"]').click();
  }
}
function setView(v, state) { show(v); applyDemo(state || DEMO[v][0][0]); }
function go(v, o = {}) {
  closeDialog(); show(v);
  if (v === 'invest') { invState = o.state || invState; demoState = invState; }
  if (v === 'saved') demoState = savedState;
  if (v === 'login') demoState = loginState;
  render(); syncDemo();
}

/* ── 이벤트 ── */
document.addEventListener('submit', (e) => { if (e.target.id === 'login-form') { e.preventDefault(); doLogin(); } });
document.addEventListener('click', (e) => {
  const t = e.target;
  const g = t.closest('[data-go]');
  if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const a = t.closest('[data-act]')?.dataset.act;
  if (view === 'invest') {
    const rm = t.closest('[data-rm]');
    if (rm) { invRemoved = rm.dataset.rm; invState = 'left'; demoState = 'left'; renderInvest(); syncDemo(); toast('note', '안내', '알림 조사 모드를 벗어났습니다.', '조건을 고쳐 사건 당시 조건이 아닙니다. 사건 조건으로 다시 보려면 사건 상세의 조사 열기를 쓰세요.'); return; }
    if (a === 'sort') { e.preventDefault(); invSort = invSort === 'desc' ? 'asc' : 'desc'; renderInvest(); return; }
    if (a === 'ud-on') { e.preventDefault(); invUd = true; renderInvest(); return; }
    if (a === 'ud-off') { invUd = false; renderInvest(); return; }
    if (a === 'save-search') { toastAction('', '성공', '검색 조건을 새 저장 검색으로 저장했습니다.', '저장 검색 “주문·결제 timeout 조사 (2)” · 알림 조사의 수신 시각 고정 범위도 함께 저장했습니다.', '열기', () => go('saved')); return; }
    if (a === 'more-rows') { toast('note', '안내', '시안에서는 더 불러올 행이 없습니다.', '제품에서는 다음 N행을 이어 붙입니다.'); return; }
    if (a === 'relogin') { loginBack = { view: 'invest', state: 'base' }; loginState = 'expired'; show('login'); demoState = 'expired'; renderLogin(); syncDemo(); return; }
    if (a === 'row') { toast('note', '안내', '이벤트 상세 패널(UI-03)은 로그 탐색 시안에서 봅니다.', '<a href="sample-ui02-log-search.html#detail">로그 탐색 시안 열기</a>'); return; }
  }
  if (view === 'nearby') {
    const m = t.closest('[data-mode]');
    if (m) { nbMode = m.dataset.mode; demoState = nbMode === 'time' ? 'time' : nbState; renderNearby(); syncDemo(); return; }
    if (a === 'to-time') { e.preventDefault(); nbMode = 'time'; demoState = 'time'; renderNearby(); syncDemo(); return; }
    if (a === 'more-before') { nbLoaded = true; renderNearby(); toast('note', '안내', '앞쪽으로 더 불러왔습니다.', '선택한 로그와 보던 위치는 그대로입니다.'); return; }
    if (a === 'more-after') { if (nbState === 'gaps') { toast('note', '안내', '조회 한도 다음부터 이어서 불러왔습니다.', '시안에서는 목록이 바뀌지 않습니다.'); return; } nbAfterLoaded = true; renderNearby(); return; }
    if (a === 'row') { toast('note', '안내', '이벤트 상세 패널(UI-03)은 로그 탐색 시안에서 봅니다.', '그 행을 가운데에 둔 주변 로그를 새로 열 수 있습니다.'); return; }
  }
  if (view === 'saved') {
    const run = t.closest('[data-run]'); if (run) { openRun(SAVED.find((x) => x.id === run.dataset.run)); return; }
    const ed = t.closest('[data-edit]'); if (ed) { opener = ed; openEdit(SAVED.find((x) => x.id === ed.dataset.edit)); return; }
    const del = t.closest('[data-del]');
    if (del) {
      const s = SAVED.find((x) => x.id === del.dataset.del);
      openDialog({ title: '저장 검색 삭제', action: '삭제', danger: true, target: [['대상', esc(s.name)]],
        impacts: ['!삭제하면 바로 지워지고 되돌릴 수 없습니다.', '같은 계정을 쓰는 모든 사람의 목록에서 사라집니다.', '저장한 조건만 지웁니다. 로그는 지우지 않습니다.', '이 조건을 복사해 만든 알림 규칙은 그대로 남습니다.'],
        onOk: () => { SAVED = SAVED.filter((x) => x !== s); renderSaved(); toast('', '성공', `${esc(s.name)}을(를) 삭제했습니다.`, ''); } });
      return;
    }
    const tb = t.closest('[data-time]'); if (tb && editing) { editTime = tb.dataset.time; const nm = $('#e-name').value; renderEditDialog(); $('#e-name').value = nm; return; }
    const bb = t.closest('[data-basis]'); if (bb && editing) { editBasis = bb.dataset.basis; const nm = $('#e-name').value; renderEditDialog(); $('#e-name').value = nm; return; }
    const rm = t.closest('#dialog-root [data-rm]'); if (rm && editing) { editChips.splice(+rm.dataset.rm.slice(1), 1); const nm = $('#e-name').value; renderEditDialog(); $('#e-name').value = nm; return; }
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('tr[data-act="row"]')) e.target.click(); });
$$('#demo-view button').forEach((b) => b.onclick = () => setView(b.dataset.v));
$('#demo-state').onchange = (e) => applyDemo(e.target.value);

const themeBtn = document.getElementById('theme');
function setTheme(t) { document.documentElement.dataset.theme = t; themeBtn.textContent = t === 'dark' ? '밝은 테마 보기' : '어두운 테마 보기'; }
themeBtn.addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
const q = new URLSearchParams(location.search);
if (q.get('theme') === 'dark') setTheme('dark');
const qv = DEMO[q.get('view')] ? q.get('view') : 'login';
setView(qv, DEMO[qv].some(([v]) => v === q.get('state')) ? q.get('state') : undefined);

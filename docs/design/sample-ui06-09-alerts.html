  body { min-width: 1080px; }
  .page { display: grid; gap: var(--layout-gutter); padding: var(--space-4) var(--layout-pad-x) calc(var(--demo-h) + 48px); max-width: 1440px; align-content: start; }

  .rules .cond-text { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .datatable thead th:has(.th-sub) { height: auto; padding-top: 6px; padding-bottom: 6px; vertical-align: bottom; }
  .cell-sub a { color: var(--color-text-link); font-weight: var(--font-weight-medium); text-underline-offset: 3px; white-space: nowrap; }
  .more-row { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4) 0; font-size: var(--text-sm); }
  .listbar { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
  .listbar .end { margin-left: auto; display: flex; gap: var(--space-2); align-items: center; }
  .chip.toggle { cursor: pointer; border: 0; padding: 0 10px; }

  .empty { padding: 48px var(--space-6); display: grid; justify-items: center; gap: var(--space-3); text-align: center; }

  /* UI-07 편집 */
  .edit { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: var(--layout-gutter); align-items: start; }
  .edit-main { display: grid; gap: var(--layout-gutter); }

  .cond-grid .any { color: var(--color-text-tertiary); font-size: var(--text-sm); }

  .summary-line { padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); background: var(--color-bg-page); font-size: var(--text-sm); color: var(--color-text-secondary); }
  .summary-line b { color: var(--color-text); font-weight: var(--font-weight-medium); }
  .num-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); }

  .side-card .body { padding: var(--space-3) var(--space-4) var(--space-4); display: grid; gap: var(--space-2); font-size: var(--text-sm); color: var(--color-text-secondary); }

  .progress-head { display: flex; align-items: baseline; gap: var(--space-2); }
  .progress-head .big { font-size: var(--text-lg); font-weight: var(--font-weight-strong); font-feature-settings: var(--font-feature-numeric); }
  .p-note { margin: 0; font-size: var(--text-sm); color: var(--color-text-secondary); }
  .page-head .rule-sum { margin-top: 6px; font-size: var(--text-sm); color: var(--color-text-secondary); max-width: 860px; }
  .datatable tbody tr.click { cursor: pointer; }
  .datatable tbody tr.click:hover td { background: var(--color-bg-hover); }
  details.legend-box { font-size: var(--text-sm); }
  details.legend-box summary { cursor: pointer; padding: var(--space-3) var(--space-4); color: var(--color-text-secondary); font-weight: var(--font-weight-medium); }

  .demo-switch { position: fixed; left: 0; right: 0; bottom: 0; height: var(--demo-h); display: flex; align-items: center; justify-content: center; gap: var(--space-2);
    padding: 0 var(--space-4); background: var(--color-toast-bg); color: var(--color-toast-text-secondary); font-size: var(--text-sm); box-shadow: var(--shadow-toast); z-index: var(--z-sticky); white-space: nowrap; }
  .demo-switch .segmented { height: 30px; background: rgb(255 255 255 / 0.08); box-shadow: none; }
  .demo-switch .segmented button { height: 26px; color: var(--color-toast-text-secondary); }
  .demo-switch .segmented button[aria-pressed="true"] { background: rgb(255 255 255 / 0.16); color: var(--color-toast-text); box-shadow: none; }
  .demo-switch select { height: 30px; border: 0; border-radius: var(--radius-full); padding: 0 var(--space-3); background: rgb(255 255 255 / 0.12); color: var(--color-toast-text); font-size: var(--text-sm); }
  .toast-stack { position: fixed; right: var(--space-4); top: calc(var(--size-topbar) + var(--space-3)); display: grid; gap: var(--space-2); z-index: var(--z-toast); }
</style>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const badge = (k, t) => `<span class="badge ${k}">${t}</span>`;
const kv = (rows) => rows.filter(Boolean).map(([k, v]) => `<div><dt>${k}</dt><dd><span>${v}</span></dd></div>`).join('');
const CHEV = '<svg class="icon" style="width:12px;height:12px"><use href="#i-right"/></svg>';

/* 시각 계산(합성 데이터용) */
const toSec = (hms) => { const [h, m, s = 0] = hms.split(':').map(Number); return h * 3600 + m * 60 + s; };
const fromSec = (t) => { const d = ((t % 86400) + 86400) % 86400; return [Math.floor(d / 3600), Math.floor(d / 60) % 60, d % 60].map((n) => String(n).padStart(2, '0')).join(':'); };
const addT = (hms, min, sec = 0) => fromSec(toSec(hms) + min * 60 + sec);
const minus = (hms, m) => fromSec(Math.floor(toSec(hms) / 60) * 60 - m * 60);
/* 메일 재시도: 첫 시도 뒤 1·2·5·10·20분, 그다음 30분씩. 최대 12회, 총 4시간 안(Q12-09). 마지막 시도는 첫 시도 약 3시간 38분 뒤 */
const RETRY_AT = [0, 1, 3, 8, 18, 38, 68, 98, 128, 158, 188, 218];
const lastTry = (first) => `<span class="cell-sub">마지막 시도 약 ${addT(first, 218).slice(0, 5)}</span>`;

/* 상태 이름 → 색(디자인 시스템 3.4절에 더한 알림 행) */
const TONE = {
  '정상': 'success', '지속': 'danger', '해소 대기': 'warning', '꺼져 있어 평가하지 않음': 'neutral',
  '완전': 'success', '일부 미관측': 'warning', '감시 불가': 'unknown', '대상 없음': 'warning',
  '대기': 'info', '전송 중': 'info', '재시도 대기': 'warning', '전송 여부 불명': 'unknown', '메일 서버 수락': 'success', '최종 실패': 'danger', '취소': 'neutral',
};
const EVAL_DESC = { '지속': '오류가 계속되는 중', '해소 대기': '임계 아래로 내려와 해소를 기다리는 중' };
const st = (s) => `${badge(TONE[s], s)}${EVAL_DESC[s] ? `<span class="cell-sub">${EVAL_DESC[s]}</span>` : ''}`;

const SEED = () => ([
  { id: 'r1', name: '주문·결제 timeout', on: true, eval: '해소 대기', quality: '완전', cond: '(서비스 주문 또는 결제) 그리고 (환경 운영) 그리고 (레벨 ERROR) 그리고 (본문에 "timeout" 포함) 그리고 (본문에 "health check" 제외) 그리고 (http.status 500 이상)', win: 15, th: 20, resolve: null, fired: '2026-11-05 09:41:00', deliv: { '메일 서버 수락': 3 }, last: '10:15:00',
    rcpt: ['ops@example.com', 'order-team@example.com', 'oncall@example.com'], targets: 4, progress: [9, 15] },
  { id: 'r2', name: '결제 ERROR', on: true, eval: '지속', quality: '일부 미관측', cond: '(서비스 결제) 그리고 (레벨 ERROR)', win: 5, th: 50, resolve: 10, fired: '2026-11-05 10:02:00', deliv: { '메일 서버 수락': 1, '재시도 대기': 1 }, last: '10:15:00',
    rcpt: ['ops@example.com', 'pay-team@example.com'], targets: 2, unobs: [['결제 · app-02 · app-*.log', '읽기 일시정지', 'warning', '10:00:47']] },
  { id: 'r3', name: '결제 5xx 응답', on: true, eval: '정상', quality: '완전', cond: '(서비스 결제) 그리고 (http.status 500 이상)', win: 60, th: 100, resolve: null, fired: '2026-11-04 22:10:00', resolvedAt: '2026-11-04 23:31:00', deliv: { '메일 서버 수락': 2 }, last: '10:15:00',
    rcpt: ['ops@example.com', 'pay-team@example.com'], targets: 2 },
  { id: 'r4', name: '주문 FATAL', on: true, eval: '정상', quality: '감시 불가', qsub: '대상 연결을 모두 관측하지 못함', cond: '(서비스 주문) 그리고 (레벨 FATAL)', win: 1, th: 1, resolve: null, fired: null, deliv: null, last: '10:15:00',
    rcpt: ['ops@example.com', 'oncall@example.com'], targets: 2, unobs: [['주문 · app-01 · app.log', '관측 오래됨/미확인', 'unknown', '09:58:12'], ['주문 · app-02 · app.log', '관측 오래됨/미확인', 'unknown', '09:58:40']] },
  { id: 'r5', name: '개발 환경 ERROR', on: false, eval: '꺼져 있어 평가하지 않음', quality: null, cond: '(환경 개발) 그리고 (레벨 ERROR)', win: 15, th: 30, resolve: null, fired: '2026-11-02 16:40:00', resolvedAt: '2026-11-02 17:12:00', deliv: { '메일 서버 수락': 1 }, last: null,
    rcpt: ['dev-team@example.com'], targets: 1 },
]).map((r) => ({ ...r, base: { quality: r.quality, qsub: r.qsub || '' } }));
/* 편집 화면의 조건 칩(규칙마다) */
const FORM0 = () => ({
  r1: { svc: ['주문', '결제'], env: ['운영'], level: ['ERROR'], body: [{ op: '포함', v: 'timeout', cs: false }, { op: '제외', v: 'health check', cs: false }], field: [{ k: 'http.status', op: '이상', v: '500' }] },
  r2: { svc: ['결제'], level: ['ERROR'] },
  r3: { svc: ['결제'], field: [{ k: 'http.status', op: '이상', v: '500' }] },
  r4: { svc: ['주문'], level: ['FATAL'] },
  r5: { env: ['개발'], level: ['ERROR'] },
});
const offRule = (r) => ({ ...r, on: false, eval: '꺼져 있어 평가하지 않음', quality: null, qsub: '', last: null, progress: null });
const applyFinal = (r) => Object.assign(r, { eval: '정상', progress: null, resolvedAt: '2026-11-05 10:24:00', deliv: { '메일 서버 수락': 1, '최종 실패': 2 }, unacked: 2 });
const OFF_AT = '2026-11-05 10:21:40';

let RULES = SEED();
let FORM = FORM0();
let view = 'list';
let demoState = 'base';
let listState = 'base';
let evalFilter = '전체';
let failFilter = false;
let auditDown = false;
let mailMissing = false;
let FINAL_UNACKED = 0; /* 사건 단위 확인 전의 최종 실패 수(WQ-02·49) */
let detailState = 'resolving';
let detailRule = 'r1';
let incCtx = { rule: 'r1', idx: 0 };
let incState = 'base';
let incMore = false;
const ruleOf = (id) => RULES.find((x) => x.id === id) || RULES[0];

function banner() {
  const b = [];
  if (listState === 'stopped') b.push(`<div class="banner danger" role="status"><strong>알림 평가 중단</strong><span>2026-11-05 10:20:00 (UTC+09:00)부터 알림 규칙을 평가하지 못하고 있습니다. 평가하지 못한 구간은 규칙 상세에 미평가 구간으로 남습니다.</span>${view === 'list' ? '' : '<a href="#" data-go="list">알림 규칙 보기</a>'}</div>`);

/* 켬/끔: 끌 때만 영향 확인(UI-06 상태 6). 알림 규칙 변경이라 비밀번호를 다시 묻지 않는다(TD-17). 감사 장애 때 보류(WQ-35) */
function toggleRule(id, after) {
  const r = RULES.find((x) => x.id === id);
  const apply = (on) => {
    if (auditDown) { toast('hold', '보류', `감사 기록을 저장할 수 없어 규칙을 ${on ? '켜지' : '끄지'} 않았습니다.`, `규칙은 ${on ? '꺼진' : '켜진'} 채로 ${on ? '평가하지 않습니다' : '평가와 메일 발송을 계속합니다'}. 감사 기록이 복구된 뒤 다시 하세요. <a href="#">감사 이력 보기</a>`); after(); return; }
    const wasOpen = r.eval === '지속' || r.eval === '해소 대기';
    Object.assign(r, { on, eval: on ? '정상' : '꺼져 있어 평가하지 않음', quality: on ? (r.base.quality || '완전') : null, qsub: on ? r.base.qsub : '', last: null, progress: null, paused: false, failing: false });
    if (!on && wasOpen && r.fired) r.closedOff = OFF_AT; /* 이어지던 사건을 `규칙 꺼짐`으로 닫는다(TD-07, WQ-45) */
    toast('', '성공', on ? `${esc(r.name)}을(를) 켰습니다.` : `${esc(r.name)}을(를) 껐습니다.`, on ? '정상에서 시작합니다. 켜자마자 조건을 넘으면 새 메일이 갑니다.' : `아직 보내지 않은 메일을 취소했${wasOpen ? '고, 이어지던 사건은 규칙 꺼짐으로 닫았' : ''}습니다.`);
    after();
  };
  if (!r.on) { apply(true); return; }
  openDialog({
    title: `규칙 끄기: ${esc(r.name)}`, action: '끄기', danger: true,
    target: [['지금 평가 상태', `${badge(TONE[r.eval], r.eval)} ${EVAL_DESC[r.eval] ? `<span class="dim">${EVAL_DESC[r.eval]}</span>` : ''}`]],
    impacts: ['!끄면 이 규칙을 평가하지 않아 조건을 넘어도 메일이 가지 않습니다.', '아직 보내지 않은 메일(대기·재시도 대기)은 취소합니다.', ...(r.eval === '지속' || r.eval === '해소 대기' ? ['지금 이어지는 사건은 규칙 꺼짐으로 닫습니다.'] : []), '다시 켜면 정상에서 시작합니다. 켜자마자 조건을 넘으면 새 메일이 갑니다.'],
    onOk: () => apply(false),
  });
}

    renderEdit();

  } else if (view === 'detail') { detailState = s; detailRule = 'r1'; Object.assign(RULES[0], DETAIL[s]); renderDetail(); }
  else {
    incState = s; incCtx = { rule: 'r1', idx: s === 'partial' ? 3 : 0 };
    if (s === 'final') { FINAL_UNACKED = 2; applyFinal(RULES[0]); }
    if (s === 'late') Object.assign(RULES[0], { eval: '정상', progress: null, resolvedAt: '2026-11-05 10:24:00' });
    if (s === 'changed') RULES[0].th = 25;
    renderIncident();
  }
  syncDemo();
}
function setView(v, state) { show(v); applyDemo(state || DEMO[v][0][0]); }
function go(v, o = {}) {
  closeDialog();
  show(v);
  if (v === 'edit') { const m = o.mode || 'edit'; editState = m === 'new' ? 'new' : 'base'; startEdit(m, o.rule || detailRule); demoState = editState; renderEdit(); }
  else if (v === 'list') { demoState = failFilter ? 'final' : listState; renderList(); }
  else if (v === 'detail') { detailRule = o.rule || detailRule; incMore = false; demoState = detailRule === 'r1' ? detailState : ''; renderDetail(); }
  else {
    const rule = o.rule || 'r1'; const idx = +(o.inc || 0);
    incCtx = { rule, idx };
    const r = ruleOf(rule);
    incState = o.state || (rule === 'r1' && idx === 0 && r.deliv && r.deliv['최종 실패'] ? 'final' : 'base');
    demoState = rule === 'r1' && idx === 0 ? incState : '';
    renderIncident();
  }
  syncDemo();
}
function rerender() { ({ list: renderList, edit: renderEdit, detail: renderDetail, incident: renderIncident })[view](); }

/* ── 이벤트 ── */
document.addEventListener('click', (e) => {
  const t = e.target;
  /* 편집 중 저장하지 않고 떠나면 확인한다 */
  if (view === 'edit' && !leaving && !t.closest('.dialog')) {
    const nav = t.closest('[data-go], .topbar a[href$=".html"]');
    if (nav) { readEdit(); if (dirtyEdit()) { e.preventDefault(); confirmLeave(nav); return; } }
  }
  const g = t.closest('[data-go]');
  if (g && !t.closest('.switch')) { e.preventDefault(); const d = g.dataset; go(d.go, { rule: d.rule, inc: d.inc, state: d.state, mode: d.mode }); return; }
  if (t.closest('[data-final-banner]')) { e.preventDefault(); failFilter = true; evalFilter = '전체'; if (listState === 'empty') listState = 'base'; go('list'); return; }
  const sw = t.closest('[data-toggle]');
  if (sw) { toggleRule(sw.dataset.toggle, rerender); return; }
  const ev = t.closest('[data-eval]');
  if (ev) { evalFilter = ev.dataset.eval; renderList(); return; }
  if (t.closest('[data-failfilter]')) { failFilter = !failFilter; renderList(); return; }
  if (t.closest('[data-clear]')) { evalFilter = '전체'; failFilter = false; renderList(); return; }
  const tr = t.closest('tr.click[data-href]');
  if (tr && !t.closest('a')) { location.href = tr.dataset.href; return; }
  if (view === 'detail' && t.closest('[data-act="more-inc"]')) { incMore = true; renderDetail(); return; }
  /* 편집 화면 */
  if (view === 'edit') {
    const rm = t.closest('[data-rm]');
    if (rm) { readEdit(); const [k, i] = rm.dataset.rm.split(':'); E[k].splice(+i, 1); errs = {}; if (k === 'rcpt') testRes = null; renderEdit(); return; }
    const ad = t.closest('[data-add]');
    if (ad) {
      readEdit(); const k = ad.dataset.add;
      const ADD = { svc: '정산', server: 'app-01', env: '운영', target: '/var/app/order/app.log', level: E.level.includes('ERROR') ? 'WARN' : 'ERROR', 'level-unknown': '미확인' };
      if (k === 'body') E.body.push({ op: '포함', v: '', cs: false });
      else if (k === 'field') E.field.push({ k: 'http.status', op: '이상', v: '' });
      else { const key = k === 'level-unknown' ? 'level' : k; if (!E[key].includes(ADD[k])) E[key].push(ADD[k]); }
      errs = {}; renderEdit(); return;
    }
    const w = t.closest('[data-win]');
    if (w) { readEdit(); E.win = w.dataset.win; delete errs.win; renderEdit(); return; }
    /* `받았음`은 저장된 주소에 바로 반영하는 따로 된 요청이다. 감사에 남기므로(API 5.6절) 감사 장애 때 보류한다 */
    const ack = t.closest('[data-ack]');
    if (ack) {
      readEdit(); const r = E.rcpt[+ack.dataset.ack];
      if (auditDown) { toast('hold', '보류', '감사 기록을 저장할 수 없어 받았음을 표시하지 않았습니다.', '복구된 뒤 다시 누르세요. <a href="#">감사 이력 보기</a>'); return; }
      r.ok = true; const rule = ruleOf(editRule); rule.okSet = [...(rule.okSet || []), r.a]; renderEdit(); toast('', '성공', `${esc(r.a)}를 확인됨으로 표시했습니다.`, '받는 사람이 받은편지함에서 메일을 확인한 주소입니다.'); return;
    }
    const act = t.closest('[data-act]');
    if (act) {
      readEdit(); const a = act.dataset.act;
      if (a === 'add-rcpt') {
        const v = $('#f-addr').value.trim();
        const norm = v.toLowerCase();
        errs = {};
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) errs.rcpt = '메일 주소 형식이 아닙니다.';
        else if (E.rcpt.some((r) => r.a.toLowerCase() === norm)) errs.rcpt = '이미 넣은 주소입니다.';
        else E.rcpt.push({ a: v, ok: false });
        renderEdit(); if (errs.rcpt) { $('#f-addr').value = v; $('#f-addr').focus(); } return;
      }
      if (a === 'test') {
        testRes = E.rcpt.map(() => `${badge('info', '전송 중')}`); renderEdit();
        setTimeout(() => { testRes = E.rcpt.map((r, i) => (/order-team/.test(r.a) ? `${badge('danger', '보내지 못함')} <span class="dim">수신자 거부: 메일 서버가 이 주소를 받지 않았습니다.</span>` : i === 2 ? `${badge('info', '전송 중')}` : `${badge('success', '메일 서버 수락')} <span class="dim">10:16:02</span>`)); if (view === 'edit') { readEdit(); renderEdit(); } }, 900);
        return;
      }
      if (a === 'save' || a === 'save-anyway') {
        if (a === 'save-anyway') noFilterOk = true;
        const bad = validateEdit(); renderEdit();
        if (bad.length) { const first = { name: '#f-name', win: '#f-win', th: '#f-th', resolve: '#f-res', rcpt: '#f-addr' }[bad[0]]; if (first) $(first).focus(); else $('[data-act="save-anyway"]')?.focus(); return; }
        doSave(); return;
      }
      if (a === 'delete') {
        const rule = ruleOf(editRule);
        openDialog({ title: `알림 규칙 삭제: ${esc(rule.name)}`, action: '삭제', danger: true,
          impacts: ['!규칙을 지우면 더 평가하지 않고, 아직 보내지 않은 메일은 취소합니다. 지금 이어지는 사건은 규칙 삭제로 닫습니다.', '지난 사건 이력과 이미 보낸 메일의 조사 링크는 남습니다. 알림 이력은 로그 보관 기간(6개월)과 같이 보관합니다.', '저장 검색은 바뀌지 않습니다.'],
          onOk: () => { if (auditDown) { toast('hold', '보류', '감사 기록을 저장할 수 없어 규칙을 지우지 않았습니다.', '규칙은 그대로 평가되고 메일도 나갑니다.'); return; } RULES = RULES.filter((x) => x.id !== editRule); toast('', '성공', '규칙을 삭제했습니다.', '사건 이력은 남습니다.'); E_SNAP = snap(E); go('list'); } });
        return;
      }
      if (a === 'reload') { const r1 = ruleOf('r1'); Object.assign(r1, { th: 25, eval: '정상', progress: null }); startEdit('edit', 'r1'); editState = 'base'; renderEdit(); toast('note', '안내', '최신 규칙을 다시 불러왔습니다.', '임계가 25건으로 바뀌어 있습니다.'); return; }
    }
  }
  if (view === 'incident' && t.closest('[data-act="ack-final"]')) { const r = ruleOf(incCtx.rule); r.acked = true; r.unacked = 0; FINAL_UNACKED = 0; renderIncident(); toast('', '성공', '최종 실패를 확인했습니다.', '메일 최종 실패 배너에서 빠졌습니다.'); return; }
});
document.addEventListener('change', (e) => { if (view === 'edit' && e.target.matches('[data-cs]')) { readEdit(); E.body[+e.target.dataset.cs].cs = e.target.checked; $('#foot-note').textContent = footNote(); } });
document.addEventListener('input', (e) => {
  if (view !== 'edit') return;
  if (e.target.matches('#f-win, #f-th, #f-res, [data-body], [data-field], #f-name')) { readEdit(); $('#edit-side').innerHTML = renderEditSide(); $('#foot-note').textContent = footNote(); $$('[data-win]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.win === E.win))); }
});
$$('#demo-view button').forEach((b) => b.onclick = () => setView(b.dataset.v));
$('#demo-state').onchange = (e) => { if (e.target.value) applyDemo(e.target.value); };

const themeBtn = document.getElementById('theme');
function setTheme(t) { document.documentElement.dataset.theme = t; themeBtn.textContent = t === 'dark' ? '밝은 테마 보기' : '어두운 테마 보기'; }
themeBtn.addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
const q = new URLSearchParams(location.search);
if (q.get('theme') === 'dark') setTheme('dark');
const qv = DEMO[q.get('view')] ? q.get('view') : 'list';
setView(qv, DEMO[qv].some(([v]) => v === q.get('state')) ? q.get('state') : undefined);
if (location.hash === '#off' && view === 'list') toggleRule('r2', rerender);
if (location.hash === '#test' && view === 'edit') $('[data-act="test"]').click();
</script>
<script src="menu.js"></script>

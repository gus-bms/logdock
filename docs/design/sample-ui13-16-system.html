<title>LogDock 시안 — 시스템</title>
<!-- 시안 표시용 글꼴. 제품은 글꼴 파일을 직접 제공하고 외부 CDN을 쓰지 않는다(design-system-v0.1.md 4절). -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="tokens-dark-preview.css">
<link rel="stylesheet" href="components.css">
<style>
  /* 이 시안의 배치. 화면 흐름 명세 5절 UI-13(저장 공간과 보존)·UI-14(메일 상태)·UI-15(감사 이력)·UI-16(계정과 세션)과 CM-01·CM-07·CM-08의 정적 시안이다.
     와이어프레임 정리표의 기본안(WQ-72~91)과 디자인 시스템 11·12절, API 계약 4.4·5.5·5.6절을 따른다.
     저장량·시각·주소는 합성 값이다. 디스크 경고 기준·로그 저장 상한·감사 저장 상한·한 번에 불러오는 행 수는 정하지 않아 `N`으로 쓴다(화면 흐름 명세 7절). */
  :root { --demo-h: 44px; }
  body { min-width: 1080px; }
  .page { display: grid; gap: var(--layout-gutter); padding: var(--space-4) var(--layout-pad-x) calc(var(--demo-h) + 48px); max-width: 1440px; align-content: start; }
  .page[hidden] { display: none; }
  .p-note { margin: 0; font-size: var(--text-sm); color: var(--color-text-secondary); }
  .card-pad { padding: var(--space-3) var(--space-4) var(--space-4); display: grid; gap: var(--space-3); }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--layout-gutter); align-items: start; }
  .stat-grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .stat .big { font-size: var(--text-lg); font-weight: var(--font-weight-strong); font-feature-settings: var(--font-feature-numeric); }
  .stat .unit { font-size: var(--text-sm); font-weight: 400; color: var(--color-text-secondary); }
  .ro { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: var(--radius-sm); font-size: 11px; font-weight: var(--font-weight-medium); color: var(--color-text-secondary); box-shadow: inset 0 0 0 1px var(--color-border-strong); }
  .cell-sub { display: block; font-size: var(--text-sm); line-height: 16px; color: var(--color-text-secondary); margin-top: 3px; }
  .datatable td.wrap { white-space: normal; padding-top: 7px; padding-bottom: 7px; }
  .section-card .kv { grid-template-columns: 148px 1fr; }

  /* UI-13 */
  .usage { display: grid; gap: var(--space-2); }
  .usage .meter { height: 10px; border-radius: 5px; }
  .usage .meter > i { border-radius: 5px; }
  .usage-legend { display: flex; gap: var(--space-5); font-size: var(--text-sm); color: var(--color-text-secondary); font-feature-settings: var(--font-feature-numeric); }
  .usage-legend b { color: var(--color-text); font-weight: var(--font-weight-medium); }
  .span-bar { display: flex; height: 28px; border-radius: var(--radius-md); overflow: hidden; box-shadow: inset 0 0 0 1px var(--color-border); font-size: var(--text-sm); }
  .span-bar > span { display: flex; align-items: center; padding: 0 var(--space-2); min-width: 0; white-space: nowrap; overflow: hidden; }
  .span-bar .gone { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--color-danger-border) 35%, transparent) 0 4px, transparent 4px 9px); color: var(--color-danger-fg); font-weight: var(--font-weight-medium); }
  .span-bar .kept { background: var(--color-success-bg); color: var(--color-success-fg); font-weight: var(--font-weight-medium); box-shadow: inset 2px 0 0 var(--color-success-border); }
  .span-scale { display: flex; justify-content: space-between; font-size: var(--text-sm); color: var(--color-text-tertiary); font-feature-settings: var(--font-feature-numeric); }
  .span-scale span:nth-child(2) { position: relative; }

  /* UI-14 */
  .add-row { display: flex; gap: var(--space-2); align-items: flex-start; flex-wrap: wrap; }
  .add-row .field { flex: 1; max-width: 360px; }
  .form-foot { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-4); border-top: 1px solid var(--color-border); background: var(--color-bg-page); border-radius: 0 0 var(--radius-xl) var(--radius-xl); }
  .form-foot .grow { margin-left: auto; display: flex; gap: var(--space-2); }
  .ops td .btn { margin-left: 2px; }

  /* UI-15 */
  .filters { display: flex; align-items: flex-end; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-border); flex-wrap: wrap; }
  .filters .date { width: 124px; }
  .filters .tilde { height: 32px; display: flex; align-items: center; color: var(--color-text-tertiary); }
  .kind-wrap { position: relative; }
  .kind-pop { position: absolute; top: calc(100% + 6px); left: 0; width: 520px; padding: var(--space-3) var(--space-4); display: grid; gap: var(--space-3); }
  .kind-groups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-3) var(--space-4); }
  .kind-groups fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 6px; align-content: start; }
  .kind-groups legend { padding: 0 0 2px; font-size: var(--text-sm); font-weight: var(--font-weight-medium); color: var(--color-text-tertiary); }
  .kind-groups label { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); }
  .audit td.t { white-space: nowrap; font-feature-settings: var(--font-feature-numeric); }
  .datatable tr.gap td, .datatable tr.cleanup td { height: auto; padding: 8px var(--space-3); white-space: normal; font-size: var(--text-sm); color: var(--color-text-secondary); }
  .datatable tr.gap td { background: var(--color-unknown-bg); border-top: 1px dashed var(--color-unknown-border); border-bottom: 1px dashed var(--color-unknown-border); }
  .datatable tr.cleanup td { background: var(--color-bg-subtle); border-top: 1px dashed var(--color-border-strong); }
  .datatable tr.gap b, .datatable tr.cleanup b { color: var(--color-text); font-weight: var(--font-weight-medium); margin-right: var(--space-2); }
  .more-row { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); font-size: var(--text-sm); border-top: 1px solid var(--color-border); }
  .empty { padding: 40px var(--space-6); display: grid; justify-items: center; gap: var(--space-3); text-align: center; }
  .empty h2 { margin: 0; font-size: var(--text-base); }
  .empty p { margin: 0; max-width: 560px; color: var(--color-text-secondary); font-size: var(--text-sm); }

  /* UI-16 */
  .acct { display: grid; grid-template-columns: minmax(0, 560px) minmax(0, 1fr); gap: var(--layout-gutter); align-items: start; }
  .acct-side { display: grid; gap: var(--layout-gutter); }
  .pw-row { display: flex; gap: var(--space-2); }
  .pw-row .input { flex: 1; }
  .session-row { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) 0; border-bottom: 1px solid color-mix(in srgb, var(--color-border) 60%, transparent); }
  .session-row:last-child { border-bottom: 0; }
  .session-row .what { flex: 1; display: grid; gap: 2px; font-size: var(--text-sm); color: var(--color-text-secondary); }
  .session-row .what b { color: var(--color-text); font-weight: var(--font-weight-medium); font-size: var(--text-md); }
  .signed-out .menu, .signed-out .topbar-end .avatar { visibility: hidden; }
  .login { max-width: 380px; margin: 48px auto 0; }
  .login .card-pad { gap: var(--space-4); }
  .login h1 { margin: 0; font-size: var(--text-lg); }

  .demo-switch { position: fixed; left: 0; right: 0; bottom: 0; height: var(--demo-h); display: flex; align-items: center; justify-content: center; gap: var(--space-2);
    padding: 0 var(--space-4); background: var(--color-toast-bg); color: var(--color-toast-text-secondary); font-size: var(--text-sm); box-shadow: var(--shadow-toast); z-index: var(--z-sticky); white-space: nowrap; }
  .demo-switch .segmented { height: 30px; background: rgb(255 255 255 / 0.08); box-shadow: none; }
  .demo-switch .segmented button { height: 26px; color: var(--color-toast-text-secondary); }
  .demo-switch .segmented button[aria-pressed="true"] { background: rgb(255 255 255 / 0.16); color: var(--color-toast-text); box-shadow: none; }
  .demo-switch select { height: 30px; border: 0; border-radius: var(--radius-full); padding: 0 var(--space-3); background: rgb(255 255 255 / 0.12); color: var(--color-toast-text); font-size: var(--text-sm); }
  .toast-stack { position: fixed; right: var(--space-4); top: calc(var(--size-topbar) + var(--space-3)); display: grid; gap: var(--space-2); z-index: var(--z-toast); }
</style>
</head>

  <div class="segmented" id="demo-view">
    <button data-v="storage" aria-pressed="true">저장 공간 UI-13</button><button data-v="mail" aria-pressed="false">메일 UI-14</button><button data-v="audit" aria-pressed="false">감사 UI-15</button><button data-v="account" aria-pressed="false">계정 UI-16</button>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const badge = (k, t) => `<span class="badge ${k}">${t}</span>`;
const kv = (rows) => rows.filter(Boolean).map(([k, v]) => `<div><dt>${k}</dt><dd><span>${v}</span></dd></div>`).join('');
const TZ = '<span class="tertiary" style="font-weight:400;font-size:var(--text-sm)">(UTC+09:00)</span>';

/* ── 전역 배너(CM-01). 순서는 명세 CM-01에 적힌 순서. 지나간 일 배너는 `확인`을 누를 때까지 남는다(WQ-03) ── */
const N = { mailErr: false, auditDown: false, auditGap: false, disk: false, early: false, unmeasurable: false, opsMissing: false };
const ACKED = {};
let view = 'storage';
function banner() {
  const link = (v, t) => (view === v ? '' : `<a href="#" data-go="${v}">${t}</a>`);
  const ack = (k) => `<button class="ack" data-ack-notice="${k}">확인</button>`;
  const b = [];
  if (N.mailErr) b.push(`<div class="banner danger" role="status"><strong>메일 연결 오류</strong><span>2026-11-05 10:31:05 (UTC+09:00)부터 메일 서버에 보내지 못하고 있습니다. 알림 메일과 운영 메일은 재시도 대기에 있습니다.</span>${link('mail', '메일 상태 보기')}</div>`);
  if (N.auditDown) b.push(`<div class="banner danger" role="status"><strong>감사 기록 장애</strong><span>2026-11-05 10:31:00 (UTC+09:00)부터 감사 기록을 저장하지 못하고 있습니다. 로그인·검색·수집은 계속됩니다. 키 발급, 등록·설정 변경, 비밀번호 변경, 알림 규칙·운영 수신 주소 변경은 보류되니 복구된 뒤 다시 실행하세요.</span>${link('audit', '감사 이력 보기')}</div>`);
  if (N.auditGap && !ACKED.auditGap) b.push(`<div class="banner" role="status"><strong>감사 기록 공백</strong><span>감사 기록이 복구됐습니다. 2026-11-05 10:31:00 ~ 10:52:00 (UTC+09:00) 구간은 기록이 비어 있습니다.</span>${link('audit', '감사 이력 보기')}${ack('auditGap')}</div>`);
  if (N.disk) b.push(`<div class="banner" role="status"><strong>디스크 경고</strong><span>중앙 로그 저장 공간이 경고 기준(N)을 넘었습니다. 공간이 부족해지면 보관 기간(6개월)이 되기 전이라도 오래된 로그부터 삭제됩니다.</span>${link('storage', '저장 공간 보기')}</div>`);
  if (N.early && !ACKED.early) b.push(`<div class="banner danger" role="status"><strong>조기 삭제 발생</strong><span>공간이 부족해 2026-11-05 03:00:12 (UTC+09:00)에 보관 기간(6개월)이 되기 전 로그를 삭제했습니다. 지금 조회 가능 시작일은 2026-07-21(수신 시각 기준)입니다.</span>${link('storage', '저장 공간 보기')}${ack('early')}</div>`);
  if (N.unmeasurable) b.push(`<div class="banner" role="status"><strong>저장 공간 측정 불가</strong><span>2026-11-05 09:10:00 (UTC+09:00) 뒤로 저장 공간을 측정하지 못하고 있습니다. 측정하지 못하는 동안에는 디스크 경고도 낼 수 없습니다.</span>${link('storage', '저장 공간 보기')}</div>`);
  if (N.opsMissing) b.push(`<div class="banner" role="status"><strong>운영 수신 주소 없음</strong><span>수집 끊김·알림 평가 실패·디스크 경고 메일을 받을 주소가 없어 이 메일들이 아무에게도 가지 않습니다.</span>${link('mail', '메일 상태 보기')}</div>`);
  $('#banner-slot').innerHTML = b.join('');
}

/* ════ UI-13 저장 공간과 보존 ═══════════════════════════════ */
const ST = {
  base: { start: '2026-05-05', warn: false, early: null, used: 120, free: 380, measured: '2026-11-05 10:40:00', est: false },
  warn: { start: '2026-05-05', warn: true, early: null, used: 430, free: 70, measured: '2026-11-05 10:40:00', est: false },
  early: { start: '2026-07-21', warn: true, early: { last: '2026-11-05 03:00:12', count: 3 }, used: 470, free: 30, measured: '2026-11-05 10:40:00', est: false },
  unknown: { unknown: true, lastOk: '2026-11-05 09:10:00' },
  estimate: { start: '2026-05-05', warn: false, early: null, used: 118, free: 382, measured: '2026-11-05 10:40:00', est: true },
};
let storageState = 'base';
function renderStorage() {
  banner();
  const s = ST[storageState];
  const u = s.unknown;
  const unk = (t = '미확인') => badge('unknown', t);
  const pct = u ? 0 : Math.round((s.used / (s.used + s.free)) * 100);
  const warnBadge = u ? unk() : s.warn ? badge('warning', '디스크 경고') : badge('success', '정상');
  const earlyBadge = u ? unk() : s.early ? badge('danger', '조기 삭제 발생') : badge('success', '없음');
  const stats = `<section class="stat-grid four" aria-label="보존 요약">
    <div class="card stat"><span class="stat-label">로그 보관 기간</span><span class="stat-value"><span class="big">6개월</span><span class="ro">읽기 전용</span></span><span class="stat-sub">모든 서비스 공통. 서버 운영자가 서버 설정에서만 바꿀 수 있습니다.</span></div>
    <div class="card stat"><span class="stat-label">조회 가능 시작일</span><span class="stat-value">${u ? unk() : `<span class="big">${s.start}</span><span class="unit">수신 시각 기준</span>`}</span><span class="stat-sub">${u ? '측정하지 못해 알 수 없습니다.' : s.early ? `${badge('warning', '6개월보다 짧음')} 조기 삭제가 없었다면 2026-05-05부터입니다.` : '보관 기간대로 6개월 전부터 조회할 수 있습니다.'}</span></div>
    <div class="card stat"><span class="stat-label">디스크 경고 상태</span><span class="stat-value">${warnBadge}</span><span class="stat-sub">${u ? '경고 기준(N)을 넘었는지 알 수 없습니다. 정상으로 보지 마세요.' : s.warn ? '경고 기준(N)을 넘었습니다. 운영 수신 주소로 운영 메일을 보냈습니다.' : '경고 기준(N) 아래입니다.'}</span></div>
    <div class="card stat"><span class="stat-label">조기 삭제 <span class="tertiary" style="font-weight:400">· 최근 6개월</span></span><span class="stat-value">${earlyBadge}</span><span class="stat-sub">${u ? '측정하지 못해 알 수 없습니다.' : s.early ? `마지막 ${s.early.last} · ${s.early.count}번` : '보관 기간이 되기 전에 지운 로그가 없습니다.'}</span></div>
  </section>`;
  const todo = !u && s.warn ? `<div class="callout warning">${badge('warning', '할 일')}<div><strong>서버 설정으로 보관 기간을 줄이거나 중앙 서버 디스크를 늘리세요.</strong> 그대로 두면 공간이 부족해질 때 보관 기간이 되기 전이라도 가장 오래된 로그부터 지워지고, 지운 로그는 되돌릴 수 없습니다. 보관 기간을 줄이면 이미 저장된 로그에도 적용됩니다.</div></div>` : '';
